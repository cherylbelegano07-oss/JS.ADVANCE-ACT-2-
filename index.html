<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Javascript 2</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      table {
        font-size: 14px;
      }

      button,
      select {
        font-family: Arial, Helvetica, sans-serif;
      }
    </style>
  </head>

  <body>
    <h1>Javascript Web Output #2</h1>

    <table id="tblInput">
      <tr>
        <td width="45%">
          <label for="txtFname">First Name:</label>
        </td>

        <td>
          <input type="text" id="txtFname" />
        </td>
      </tr>

      <tr>
        <td>
          <label for="txtMname">Middle Name:</label>
        </td>

        <td>
          <input type="text" id="txtMname" />
        </td>
      </tr>

      <tr>
        <td>
          <label for="txtLname">Last Name:</label>
        </td>

        <td>
          <input type="text" id="txtLname" />
        </td>
      </tr>

      <tr>
        <td>
          <label for="txtAge">Age:</label>
        </td>

        <td>
          <input type="number" id="txtAge" />
        </td>
      </tr>

      <tr style="height: 20px">
        <td></td>

        <td style="padding-top: 15px">
          <button id="btnInsertUpdate" value="insert">Insert</button>

          <button id="btnClear">Clear</button>
        </td>
      </tr>
    </table>

    <br />

    <fieldset>
      <legend>Records</legend>

      <p id="status" style="color: red; font-size: 12px">No Records...</p>

      <table
        id="tblRecords"
        style="border-collapse: collapse; margin: auto"
      ></table>
    </fieldset>

    <button id="btnClearItems" style="margin-top: 10px">Clear Records</button>

    <span> Sort by: </span>

    <select id="sortBy">
      <option value="lname">Last Name</option>
      <option value="fname">First Name</option>
      <option value="mname">Middle Name</option>
      <option value="age">Age</option>
    </select>

    <select id="sortOrder">
      <option value="asc">A-Z</option>
      <option value="desc">Z-A</option>
    </select>

    <button id="btnSaveLocalStorage">Save to Local Storage</button>

    <script>
      function saveToLocalStorage(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }

      function getFromLocalStorage(key) {
        const data = localStorage.getItem(key);

        if (data) {
          return JSON.parse(data);
        }

        return [];
      }
    </script>

    <script src="main.js"></script>
  </body>
</html>
